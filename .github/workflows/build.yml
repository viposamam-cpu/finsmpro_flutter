name: Build Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Unzip project files
        run: |
          if [ -f "finsmpro_flutter.zip" ]; then
            unzip -o finsmpro_flutter.zip
          fi

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android & Build Universal Release
        run: |
          cd finsmpro_flutter
          rm -rf android
          # إنشاء هوية حزمة جديدة كلياً لتجنب أي تعارض في الجوال
          flutter create . --org com.osamah.finsmproomega --platforms=android
          
          # ضبط التوافقية بشكل آمن
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle || true
          
          flutter clean
          flutter pub get
          # بناء نسخة شاملة (Fat APK) تتوافق مع جميع المعالجات
          flutter build apk --release

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-universal-apk
          path: finsmpro_flutter/build/app/outputs/flutter-apk/app-release.apk
