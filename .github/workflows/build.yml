name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Unzip project files
        run: |
          if [ -f "finsmpro_flutter.zip" ]; then
            unzip -o finsmpro_flutter.zip
          fi

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd finsmpro_flutter
          flutter pub get

      - name: Build APK
        run: |
          cd finsmpro_flutter
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-release-apk
          path: finsmpro_flutter/build/app/outputs/flutter-apk/app-release.apk
        run: flutter pub get

      - name: Build APK
        defaults:
          run:
            working-directory: finsmpro_flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-release-apk
          path: finsmpro_flutter/build/app/outputs/flutter-apk/app-release.apk
        run: flutter pub get

      - name: Build APK
        defaults:
          run:
            working-directory: finsmpro_flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-release-apk
          path: finsmpro_flutter/build/app/outputs/flutter-apk/app-release.apk
          cd "$TARGET_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
