name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Unzip project files
        run: |
          if [ -f "finsmpro_flutter.zip" ]; then
            unzip -o finsmpro_flutter.zip
          fi

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK inside directory
        run: |
          TARGET_DIR=$(find . -mindepth 2 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Target Directory is: $TARGET_DIR"
          cd "$TARGET_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
