name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Unzip project files
        run: |
          if [ -f "finsmpro_flutter.zip" ]; then
            unzip -o finsmpro_flutter.zip
          fi

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android & Build Fixed APK
        run: |
          cd finsmpro_flutter
          rm -rf android
          flutter create . --org com.finsmpro.omega --platforms=android
          
          # ضبط الحد الأدنى للنظام وتفعيل MultiDex
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true

          flutter pub get
          flutter build apk --debug --target-platform android-arm,android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-debug-apk
          path: finsmpro_flutter/build/app/outputs/flutter-apk/app-debug.apk
          
