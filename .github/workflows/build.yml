name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Unzip project files & move contents
        run: |
          if [ -f "finsmpro_flutter.zip" ]; then
            unzip -o finsmpro_flutter.zip
            if [ -d "finsmpro_flutter" ]; then
              cp -rn finsmpro_flutter/* . || true
              cp -rn finsmpro_flutter/.* . 2>/dev/null || true
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
