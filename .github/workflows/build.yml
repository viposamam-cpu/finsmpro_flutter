name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Unzip & Move to root
        run: |
          if [ -f "finsmpro_flutter.zip" ]; then
            unzip -o finsmpro_flutter.zip
          fi
          # البحث عن المجلد الذي يحتوي pubspec.yaml ونقل كافة محتوياته إلى الجذر مباشرة
          PROJECT_DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \;)
          if [ "$PROJECT_DIR" != "." ]; then
            cp -rn $PROJECT_DIR/* . || true
            cp -rn $PROJECT_DIR/.* . 2>/dev/null || true
          fi

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsmpro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
