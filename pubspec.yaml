name: finsmpro_omega
description: FinSMPro Omega - Saudi Market Trading App (Flutter client)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage (يُحاكي جداول Postgres محلياً على الجهاز)
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2   # لتخزين مفاتيح AI / التوكن بأمان
  shared_preferences: ^2.2.3       # إعدادات بسيطة (theme, last_sync...)

  # شبكة
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # عرض بيانات
  fl_chart: ^0.68.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
